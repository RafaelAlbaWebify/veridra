name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        timeout-minutes: 5
        run: python -m playwright install chromium
      - name: Ruff
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          ruff check . 2>&1 | tee artifacts/ci/ruff.log
      - name: Strict mypy
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          mypy src tests 2>&1 | tee artifacts/ci/mypy.log
      - name: Pytest
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          pytest 2>&1 | tee artifacts/ci/pytest.log
      - name: Deterministic audit
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          python -m veridra.audit 2>&1 | tee artifacts/ci/audit.log
      - name: Prospect discovery workflow acceptance
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          python scripts/browser/discovery_workflow_acceptance.py 2>&1 | tee artifacts/ci/prospect-discovery-browser-acceptance.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridra-verification
          path: artifacts

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        timeout-minutes: 5
        run: python -m playwright install chromium
      - name: Prepare supported launcher environment
        shell: pwsh
        run: python -m venv .venv --system-site-packages
      - name: Verify timezone database
        shell: pwsh
        run: |
          python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('UTC'), ZoneInfo('Europe/Madrid'), ZoneInfo('Europe/Dublin'))"
      - name: Parse Windows PowerShell launchers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }
      - name: Windows portability tests
        shell: pwsh
        run: |
          pytest tests/test_monitoring_schedule.py tests/test_monitoring_service.py tests/test_backup_restore.py tests/test_session_lifecycle_api.py tests/test_project_store.py tests/test_report_delivery.py
      - name: Synthetic Windows Market Study acceptance
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/windows/VERIDRA_MARKET_STUDY_ACCEPTANCE.ps1
      - name: Market Study restart integrity contract (synthetic)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'market-restart-fixture'
          $folder = Join-Path $root '_market_studies/test-tenant'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          '{"study_id":"fixture","businesses":[{"business_id":"one"}],"crm_promoted":[]}' | Set-Content -Path (Join-Path $folder 'test.json') -Encoding utf8
          $manifest = Join-Path $env:RUNNER_TEMP 'market-restart-manifest.json'
          ./scripts/windows/VERIDRA_MARKET_RESTART_INTEGRITY.ps1 -Mode Capture -DataRoot $root -Manifest $manifest
          ./scripts/windows/VERIDRA_MARKET_RESTART_INTEGRITY.ps1 -Mode Verify -DataRoot $root -Manifest $manifest
      - name: Sales-to-contract Playwright acceptance
        timeout-minutes: 15
        shell: pwsh
        run: python tools/sales_contract_acceptance.py
      - name: True Playwright first-customer operator acceptance
        timeout-minutes: 15
        shell: cmd
        env:
          VERIDRA_E2E_VIEWPORT_WIDTH: "1920"
          VERIDRA_E2E_VIEWPORT_HEIGHT: "1080"
        run: VERIDRA_OPERATOR_E2E_ACCEPTANCE.bat
      - name: Upload Playwright sales-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridra-sales-contract-acceptance
          path: artifacts/sales-contract-acceptance
          if-no-files-found: warn
      - name: Upload Playwright visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridra-operator-visual
          path: artifacts/operator-visual
          if-no-files-found: warn
