[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridra"
dynamic = ["version"]
description = "Automated website visibility, AI discoverability, trust, health and public security posture assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "fastapi<1,>=0.115",
    "httpx<1,>=0.27",
    "playwright<2,>=1.52",
    "pydantic<3,>=2.8",
    "tzdata>=2025.2",
    "uvicorn<1,>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy<2,>=1.11",
    "pytest<9,>=8",
    "pytest-asyncio<1,>=0.24",
    "pytest-cov<7,>=5",
    "ruff<1,>=0.6",
]

[project.scripts]
veridra-api = "veridra.runtime:main"
veridra-audit = "veridra.audit:main"
veridra-project-migrate = "veridra.project_migration_cli:main"
veridra-identity-bootstrap = "veridra.identity_bootstrap_cli:main"
veridra-monitoring-worker = "veridra.monitoring_worker_cli:main"
veridra-subscription-apply = "veridra.subscription_authority_cli:main"
veridra-backup = "veridra.backup_restore_cli:main"
veridra-ops-check = "veridra.ops_check_cli:main"
veridra-tenant-offboard = "veridra.tenant_offboarding_cli:main"
veridra-production-preflight = "veridra.production_preflight_cli:main"
veridra-deployment-check = "veridra.deployment_acceptance_cli:main"
veridra-assisted-discovery-check = "veridra.assisted_discovery_acceptance_cli:main"
veridra-discovery-evidence = "veridra.automated_discovery_evidence_cli:main"
veridra-prospect-audit-evidence = "veridra.prospect_audit_evidence_cli:main"
veridra-prospect-qualification-evidence = "veridra.prospect_qualification_evidence_cli:main"
veridra-visual-outreach-evidence = "veridra.visual_outreach_hardened_cli:main"
veridra-dublin-acquisition-batch = "veridra.dublin_acquisition_batch_regulatory_cli:main"
veridra-dublin-visual-reprocess = "veridra.dublin_visual_reprocess_cli:main"
veridra-local-competitive-context = "veridra.local_competitive_context_cli:main"
veridra-ai-evidence-exchange = "veridra.ai_evidence_exchange_review_cli:main"
veridra-review-intelligence = "veridra.review_intelligence_sampling_safe_cli:main"
veridra-review-intelligence-acceptance = "veridra.review_intelligence_acceptance_cli:main"

[tool.setuptools.dynamic]
version = {attr = "veridra.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=veridra --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["veridra"]

[[tool.mypy.overrides]]
module = "veridra.local_competitive_context_cli"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "veridra.review_intelligence_cli"
disable_error_code = ["attr-defined", "assignment"]

[[tool.mypy.overrides]]
module = "veridra.review_intelligence_hardened_cli"
disable_error_code = ["call-overload", "assignment"]

[[tool.mypy.overrides]]
module = "veridra.review_intelligence_sampling_safe_cli"
disable_error_code = ["attr-defined"]

[tool.ruff.lint.per-file-ignores]
"src/veridra/app.py" = ["E501"]
"src/veridra/core.py" = ["E501"]
"src/veridra/audit.py" = ["E501"]
"src/veridra/reports.py" = ["E501", "F841"]
"src/veridra/profile_web.py" = ["E501"]
"src/veridra/project_web.py" = ["E501", "UP032"]
"src/veridra/public_web.py" = ["E501", "UP032"]
"src/veridra/task_web.py" = ["E501"]
"src/veridra/lead_web.py" = ["E501", "F401", "UP032"]
"src/veridra/prospect_audit_evidence_cli.py" = ["E501"]
"src/veridra/prospect_qualification_evidence_cli.py" = ["E501"]
"src/veridra/visual_outreach_evidence_cli.py" = ["E501", "UP012"]
"src/veridra/visual_outreach_evidence_strict_cli.py" = ["E501"]
"src/veridra/visual_outreach_regulatory_cli.py" = ["E501"]
"src/veridra/visual_outreach_hardened_cli.py" = ["E501"]
"src/veridra/local_competitive_context_cli.py" = ["E501"]
"src/veridra/ai_evidence_exchange_cli.py" = ["E501", "I001"]
"src/veridra/ai_evidence_exchange_review_cli.py" = ["E501", "UP012"]
"src/veridra/review_intelligence_cli.py" = ["E501", "I001"]
"src/veridra/review_intelligence_hardened_cli.py" = ["E501", "I001"]
"src/veridra/dublin_acquisition_batch_cli.py" = ["E501"]
"src/veridra/dublin_acquisition_batch_resilient_cli.py" = ["E501"]
"src/veridra/dublin_acquisition_batch_regulatory_cli.py" = ["E501"]
"tests/test_ai_review_evidence_exchange_cli.py" = ["E501"]
"tests/test_report_profiles.py" = ["E501", "I001"]
"tests/test_prospect_qualification_evidence_cli.py" = ["E501"]
"tests/test_visual_outreach_evidence_cli.py" = ["E501"]
