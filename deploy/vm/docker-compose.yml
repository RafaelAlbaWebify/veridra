services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VERIDRA_DOMAIN: ${VERIDRA_DOMAIN:?set VERIDRA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/veridra/caddy/data:/data
      - /srv/veridra/caddy/config:/config
    networks:
      - edge

  web:
    build:
      context: ../..
    image: veridra:${VERIDRA_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${VERIDRA_ENV_FILE:-/etc/veridra/veridra.env}
    environment:
      VERIDRA_BIND_HOST: 0.0.0.0
      VERIDRA_BIND_PORT: 8000
    volumes:
      - /srv/veridra/data:/var/lib/veridra
    expose:
      - "8000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  worker:
    image: veridra:${VERIDRA_IMAGE_TAG:-local}
    profiles: ["worker"]
    env_file:
      - ${VERIDRA_ENV_FILE:-/etc/veridra/veridra.env}
    volumes:
      - /srv/veridra/data:/var/lib/veridra
    command: ["veridra-monitoring-worker", "--limit", "10"]
    networks:
      - edge

networks:
  edge:
    driver: bridge
